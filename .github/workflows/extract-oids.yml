name: Extract Certificate OIDs

on:
  push:
    branches: [ main, master ]
    paths:
      - 'com.apple.tips.txt'
      - '.github/workflows/extract-oids.yml'
  workflow_dispatch:

jobs:
  extract-oids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install openssl
        run: sudo apt-get update && sudo apt-get install -y openssl

      - name: Extract leaf certificate and parse OIDs
        run: |
          python3 << 'EOF'
          import base64, subprocess, tempfile, os

          with open('com.apple.tips.txt', 'rb') as f:
              data = f.read()

          start = data.find(b'\x30\x82')
          if start == -1:
              print("❌ 未找到证书")
              exit(1)

          cert_len = (data[start+2] << 8) | data[start+3]
          leaf_cert = data[start:start+cert_len+4]
          print(f"✅ 找到叶子证书，大小: {len(leaf_cert)} 字节")

          with tempfile.NamedTemporaryFile(mode='wb', suffix='.der', delete=False) as tmp:
              tmp.write(leaf_cert)
              tmp_path = tmp.name

          # 保存 PEM
          b64 = base64.b64encode(leaf_cert).decode()
          pem = '-----BEGIN CERTIFICATE-----\n' + '\n'.join(b64[i:i+64] for i in range(0, len(b64), 64)) + '\n-----END CERTIFICATE-----\n'
          with open('leaf.pem', 'w') as f:
              f.write(pem)

          # 创建 TXT 输出文件
          with open('certificate-info.txt', 'w', encoding='utf-8') as txt:
              txt.write("=" * 60 + "\n")
              txt.write("📜 叶子证书中的所有 OID\n")
              txt.write("=" * 60 + "\n")
              
              result = subprocess.run(f'openssl x509 -in {tmp_path} -inform DER -text -noout', shell=True, capture_output=True, text=True)
              for line in result.stdout.split('\n'):
                  if any(c.isdigit() for c in line) and '.' in line:
                      txt.write(line.strip() + "\n")
                      print(line.strip())

              txt.write("\n" + "=" * 60 + "\n")
              txt.write("🔑 Team ID OID (1.2.840.113635.100.6.1.15) 详情\n")
              txt.write("=" * 60 + "\n")
              
              result2 = subprocess.run(f'openssl asn1parse -inform DER -in {tmp_path} | grep -A 10 "1.2.840.113635.100.6.1.15"', shell=True, capture_output=True, text=True)
              if result2.stdout:
                  txt.write(result2.stdout + "\n")
                  print(result2.stdout)
              else:
                  txt.write("❌ 未找到 Team ID OID 或值为空\n")
                  print("❌ 未找到 Team ID OID 或值为空")

              txt.write("\n" + "=" * 60 + "\n")
              txt.write("📋 证书基本信息\n")
              txt.write("=" * 60 + "\n")
              
              result3 = subprocess.run(f'openssl x509 -in {tmp_path} -inform DER -noout -subject -issuer -dates -fingerprint -sha256', shell=True, capture_output=True, text=True)
              txt.write(result3.stdout + "\n")
              print(result3.stdout)

              txt.write("\n" + "=" * 60 + "\n")
              txt.write("📄 叶子证书 (PEM 格式)\n")
              txt.write("=" * 60 + "\n")
              txt.write(pem)

          print("\n✅ 已保存 certificate-info.txt")
          print("✅ 已保存 leaf.pem")

          os.unlink(tmp_path)
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: certificate-files
          path: |
            leaf.pem
            certificate-info.txt

      - name: Save to workflow summary
        run: |
          if [ -f certificate-info.txt ]; then
            echo "### 📜 证书提取结果" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat certificate-info.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
