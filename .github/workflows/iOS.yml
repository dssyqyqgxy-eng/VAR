name: Extract Leaf Certificate

on:
  push:
    paths:
      - 'com.apple.tips.txt'
  workflow_dispatch:

jobs:
  extract-leaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract leaf certificate from com.apple.tips.txt
        run: |
          python3 << 'EOF'
          import base64
          import struct
          
          with open('com.apple.tips.txt', 'rb') as f:
              data = f.read()
          
          # 找第一个 DER 证书 (叶子证书)
          start = data.find(b'\x30\x82')
          if start == -1:
              print("未找到证书")
              exit(1)
          
          # 解析证书长度
          # 格式: 0x30 0x82 [长度高8位] [长度低8位]
          if len(data) > start + 4:
              cert_len = (data[start+2] << 8) | data[start+3]
              total_len = cert_len + 4
              leaf_cert = data[start:start+total_len]
              
              print(f"✅ 找到叶子证书，大小: {len(leaf_cert)} 字节")
              
              # 转换为 PEM
              b64 = base64.b64encode(leaf_cert).decode()
              pem = '-----BEGIN CERTIFICATE-----\n'
              pem += '\n'.join(b64[i:i+64] for i in range(0, len(b64), 64))
              pem += '\n-----END CERTIFICATE-----\n'
              
              # 保存文件
              with open('leaf.pem', 'w') as f:
                  f.write(pem)
              
              # 输出到日志
              print("\n=== 叶子证书 (PEM/Base64) ===\n")
              print(pem)
          else:
              print("文件太短，无法解析")
              exit(1)
          EOF
      
      - name: Display certificate info (OIDs)
        run: |
          if [ -f leaf.pem ]; then
            echo "=== 证书基本信息 ==="
            openssl x509 -in leaf.pem -noout -subject -issuer -dates
            echo ""
            echo "=== 证书中的 OID ==="
            openssl x509 -in leaf.pem -text -noout | grep -E "([0-9]+\.)+[0-9]+" | head -20
            echo ""
            echo "=== Team ID 字段 (OID 1.2.840.113635.100.6.1.15) ==="
            openssl x509 -in leaf.pem -text -noout | grep -A 2 "1.2.840.113635.100.6.1.15" || echo "未找到或值为空"
          fi
      
      - name: Upload leaf certificate
        uses: actions/upload-artifact@v4
        with:
          name: leaf-certificate
          path: leaf.pem
