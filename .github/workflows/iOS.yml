name: Extract Leaf Certificate

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  extract-leaf:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Extract leaf certificate from com.apple.tips.txt
        run: |
          python3 << 'EOF'
          import base64
          
          # 读取二进制文件
          with open('com.apple.tips.txt', 'rb') as f:
              data = f.read()
          
          # 查找 DER 证书起始标记 (叶子证书)
          start = data.find(b'\x30\x82')
          if start == -1:
              print("❌ 未找到证书")
              exit(1)
          
          # 解析证书长度
          cert_len = (data[start+2] << 8) | data[start+3]
          total_len = cert_len + 4
          leaf_cert = data[start:start+total_len]
          
          print(f"✅ 找到叶子证书，大小: {len(leaf_cert)} 字节")
          
          # 转换为 PEM (Base64)
          b64 = base64.b64encode(leaf_cert).decode()
          pem = '-----BEGIN CERTIFICATE-----\n'
          pem += '\n'.join(b64[i:i+64] for i in range(0, len(b64), 64))
          pem += '\n-----END CERTIFICATE-----\n'
          
          # 保存文件
          with open('leaf.pem', 'w') as f:
              f.write(pem)
          
          # 输出到日志
          print("\n" + "="*60)
          print("📜 叶子证书 (PEM/Base64)")
          print("="*60)
          print(pem)
          print("="*60)
          EOF
      
      - name: Display certificate information
        run: |
          if [ -f leaf.pem ]; then
            echo "=== 证书基本信息 ==="
            openssl x509 -in leaf.pem -noout -subject -issuer -dates 2>/dev/null || echo "openssl 不可用，跳过"
            echo ""
            echo "=== 证书中的 OID ==="
            openssl x509 -in leaf.pem -text -noout 2>/dev/null | grep -E "([0-9]+\.)+[0-9]+" | head -20 || echo "openssl 不可用"
          fi
      
      - name: Upload certificate as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaf-certificate
          path: leaf.pem
          compression-level: 0
      
      - name: Save to workflow summary
        run: |
          if [ -f leaf.pem ]; then
            echo "### 📜 提取的叶子证书" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat leaf.pem >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
