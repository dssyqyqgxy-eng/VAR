name: 搜索并修改元数据
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索特征值
        run: |
          python3 << 'PYEOF'
          import struct, glob

          dump_path = glob.glob("**/dump.cs", recursive=True)[0]
          print(f"📂 dump.cs: {dump_path}")

          print("\n=== 字段类内偏移 ===")
          with open(dump_path, 'r', encoding='utf-8', errors='ignore') as f:
              for line in f:
                  if "// 0x" in line:
                      for key in ["attack_cooldown", "SHADOW_DASH_COOLDOWN", "hasShadowDash", "canShadowDash", "hp"]:
                          if key in line:
                              print(f"  {line.strip()}")

          print("\n=== 搜索 float 默认值 ===")
          with open('global-metadata.dat', 'rb') as f:
              data = f.read()

          for val, name in [(0.4, "攻击冷却"), (0.5, "黑冲冷却")]:
              pattern = struct.pack('<f', val)
              pos, count = 0, 0
              while count < 10:
                  pos = data.find(pattern, pos)
                  if pos == -1: break
                  print(f"  {name} ({val}f) @ 0x{pos:07X}")
                  pos += 1
                  count += 1

          print("\n=== 搜索 bool 默认值 ===")
          # hasShadowDash/canShadowDash 默认 false = 0x00
          # 搜索连续的 0x00 0x00 0x00 0x00 附近有字段标志
          print("  bool 字段默认 false，需手动确认偏移")
          PYEOF

      - name: 保存结果
        run: |
          mkdir -p output
          python3 << 'PYEOF' > output/search_result.txt
          import struct, glob
          dump_path = glob.glob("**/dump.cs", recursive=True)[0]
          with open(dump_path) as f:
              for line in f:
                  if "// 0x" in line and any(k in line for k in ["attack_cooldown", "SHADOW_DASH", "hasShadowDash", "canShadowDash", "hp"]):
                      print(line.strip())
          with open('global-metadata.dat', 'rb') as f:
              data = f.read()
          for val, name in [(0.4, "攻击冷却"), (0.5, "黑冲冷却")]:
              p = struct.pack('<f', val)
              for i, pos in enumerate([data.find(p)]):
                  if pos != -1:
                      print(f"{name} ({val}f) @ 0x{pos:07X}")
          PYEOF

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: output/
