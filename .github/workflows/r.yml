name: 搜索黑冲粒子特效字段偏移
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压
        run: unzip -o script.zip
      - name: 搜索
        run: |
          DUMP=$(find . -name "dump.cs" | head -1)
          echo "=== 黑冲粒子/Burst 字段 ==="
          grep -n "shadowdash\|shadow_dash\|shadowDash" "$DUMP" | grep -iE "burst|particle|prefab|effect|vfx" | head -20
          echo ""
          echo "=== ShadowDash 函数完整代码 ==="
          grep -A 50 "private void ShadowDash" "$DUMP" | head -60
          echo ""
          echo "=== HeroController 中所有 shadow 相关字段 ==="
          grep -n "shadow\|Shadow" "$DUMP" | grep "0x" | head -30
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: shadow-particles
          path: $(find . -name "*.txt" | head -1)
