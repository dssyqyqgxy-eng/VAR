name: Capstone 反汇编
on:
  push:
  workflow_dispatch:
jobs:
  disasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压
        run: unzip -o UnityFramework.zip
      - name: 安装 Capstone
        run: pip install capstone
      - name: 反汇编
        run: |
          python3 << 'PYEOF'
          from capstone import *

          with open('UnityFramework', 'rb') as f:
              data = f.read()

          md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          md.detail = True

          def disasm(name, addr, size=0x80):
              print(f"\n=== {name} ({hex(addr)}) ===")
              code = data[addr:addr+size]
              for insn in md.disasm(code, addr):
                  print(f"  0x{insn.address:x}: {insn.mnemonic} {insn.op_str}")

          disasm("ShadowDash",       0x102D4DC)
          disasm("TakeDamage",       0x102614C, 0xC0)
          disasm("ApplyExtraDamage", 0x1022A58)
          disasm("DoAttack",         0x102FF1C)
          disasm("AnimPlay",         0x1314A7C)
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: capstone-disasm
          path: $(find . -name "*.txt" | head -1)
