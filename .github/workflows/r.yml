name: Extract Resource to TXT and Upload

on:
  push:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install UnityPy
        run: pip install UnityPy
        
      - name: Extract all to TXT
        run: |
          python3 << 'EOF'
          import UnityPy
          import os
          import glob
          
          os.makedirs("output", exist_ok=True)
          
          for res_file in glob.glob("*.resource"):
              print(f"\n处理: {res_file}")
              env = UnityPy.load(res_file)
              
              with open(f"output/{res_file}.txt", "w", encoding="utf-8") as out:
                  for obj in env.objects:
                      out.write(f"\n=== Type: {obj.type.name} | ID: {obj.path_id} ===\n")
                      try:
                          data = obj.read()
                          for attr in dir(data):
                              if not attr.startswith('_'):
                                  try:
                                      val = getattr(data, attr)
                                      if not callable(val):
                                          out.write(f"{attr}: {val}\n")
                                  except:
                                      pass
                      except Exception as e:
                          out.write(f"Error: {e}\n")
          
          print("✅ 提取完成")
          EOF
          
      # ⬇️⬇️⬇️ 上传步骤 ⬇️⬇️⬇️
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extracted-txt
          path: output/
          retention-days: 30
