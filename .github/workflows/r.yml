name: 精确定位 metadata 偏移
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 下载 Il2CppDumper CLI
        run: |
          wget -q https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.40/Il2CppDumper-v6.7.40-linux.zip
          unzip -q Il2CppDumper-v6.7.40-linux.zip

      - name: 分析 metadata
        run: |
          # 找 dump.cs 和主二进制
          DUMP_PATH=$(find . -name "dump.cs" | head -1)
          echo "dump.cs: $DUMP_PATH"
          
          # 从 dump.cs 直接提取字段的 RVA
          echo ""
          echo "=== 字段元数据信息 ==="
          grep -B 5 -A 5 "attack_cooldown\|SHADOW_DASH_COOLDOWN\|hasShadowDash\|canShadowDash" "$DUMP_PATH" | head -50

      - name: 搜索 metadata 结构
        run: |
          python3 << 'PYEOF'
          import struct

          with open('global-metadata.dat', 'rb') as f:
              data = f.read()

          # metadata 文件结构：
          # 头部: 0xAF1BB1FA (magic) + version
          # 后面是字符串表、类型定义、字段定义等

          # 搜索 "attack_cooldown" 字符串在 metadata 中的位置
          target_str = b"attack_cooldown"
          pos = data.find(target_str)
          if pos != -1:
              print(f"✅ 'attack_cooldown' 字符串 @ 0x{pos:07X}")
              print(f"   上下文: {data[pos-16:pos+32].hex()}")
          else:
              print("❌ 'attack_cooldown' 字符串未找到")

          # 搜索 "SHADOW_DASH_COOLDOWN"
          pos = data.find(b"SHADOW_DASH_COOLDOWN")
          if pos != -1:
              print(f"\n✅ 'SHADOW_DASH_COOLDOWN' 字符串 @ 0x{pos:07X}")
              print(f"   上下文: {data[pos-16:pos+32].hex()}")

          # 搜索 hasShadowDash
          pos = data.find(b"hasShadowDash")
          if pos != -1:
              print(f"\n✅ 'hasShadowDash' 字符串 @ 0x{pos:07X}")

          # 搜索 canShadowDash
          pos = data.find(b"canShadowDash")
          if pos != -1:
              print(f"\n✅ 'canShadowDash' 字符串 @ 0x{pos:07X}")
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: metadata-analysis
          path: $(find . -name "*.txt" | head -1)
