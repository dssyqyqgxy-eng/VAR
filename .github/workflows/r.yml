name: 精确修改黑冲冷却（三字段定位）
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 三字段定位 + 修改
        run: |
          python3 << 'PYEOF'
          import struct

          with open('global-metadata.dat', 'rb') as f:
              data = bytearray(f.read())

          s1 = data.find(b"SHADOW_DASH_SPEED")
          s2 = data.find(b"SHADOW_DASH_TIME")
          s3 = data.find(b"SHADOW_DASH_COOLDOWN")

          print(f"SPEED    @ 0x{s1:07X}")
          print(f"TIME     @ 0x{s2:07X}")
          print(f"COOLDOWN @ 0x{s3:07X}")

          p03 = struct.pack('<f', 0.3)
          p05 = struct.pack('<f', 0.5)

          center = (s1 + s2 + s3) // 3
          start = max(0, center - 1000)
          end = min(len(data), center + 1000)

          pos = start
          while pos < end - 8:
              if data[pos:pos+4] == p03 and data[pos+4:pos+8] == p05:
                  print(f"\n✅ 找到 0.3f+0.5f 相邻 @ 0x{pos:07X}")
                  data[pos+4:pos+8] = struct.pack('<f', 0.0)
                  with open('global-metadata.dat', 'wb') as f:
                      f.write(data)
                  print("✅ 黑冲冷却 → 0.0f")
                  exit(0)
              pos += 4

          print("❌ 未找到，跳过修改")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: global-metadata-patched
          path: global-metadata.dat
