name: 全文件搜索并修改黑冲冷却
on:
  push:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 搜索并修改
        run: |
          python3 << 'PYEOF'
          import struct

          with open('global-metadata.dat', 'rb') as f:
              data = bytearray(f.read())

          p03 = struct.pack('<f', 0.3)
          p05 = struct.pack('<f', 0.5)

          print(f"文件: {len(data)} 字节\n搜索 0.3f + 0.5f 相邻...")

          found = []
          pos = 0
          while pos < len(data) - 8:
              if data[pos:pos+4] == p03 and data[pos+4:pos+8] == p05:
                  found.append(pos)
              pos += 4

          if found:
              pos = found[0]
              print(f"✅ 找到 {len(found)} 处，修改第一处")
              print(f"   TIME 默认值 @ 0x{pos:07X}")
              print(f"   COOLDOWN 默认值 @ 0x{pos+4:07X}")
              data[pos+4:pos+8] = struct.pack('<f', 0.0)
              with open('global-metadata.dat', 'wb') as f:
                  f.write(data)
              print("✅ 完成")
          else:
              print("❌ 未找到 0.3f+0.5f 相邻，文件未修改")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: global-metadata-patched
          path: global-metadata.dat
