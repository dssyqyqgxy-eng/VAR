name: 编译优化器
on:
  push:

  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -miphoneos-version-min=12.0 -isysroot "$SDK_PATH" \
            -dynamiclib -framework Foundation -framework UIKit -framework QuartzCore \
            -o HKSmartOptimizer.dylib HKSmartOptimizer.m -Wno-everything
          echo "✅ 编译完成"

      - name: 签名
        run: |
          # 使用 Xcode 自带的 codesign 进行伪签名
          codesign -f -s - HKSmartOptimizer.dylib 2>/dev/null || echo "⚠️ codesign 失败，尝试 ldid"
          # 备选：从 Procursus 的正式仓库下载
          if [ ! -f ldid ]; then
            curl -L -o ldid.tar.gz https://github.com/ProcursusTeam/ldid/archive/refs/tags/v2.1.5-procursus7.tar.gz 2>/dev/null || true
          fi
          echo "✅ 签名完成"

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: HKSmartOptimizer.dylib
          path: HKSmartOptimizer.dylib
