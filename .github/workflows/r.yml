name: NOP 黑冲冷却 + 充能粒子
on: 
  push:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压
        run: unzip -o UnityFramework.zip
      - name: NOP
        run: |
          python3 << 'PYEOF'
          import struct
          with open('UnityFramework', 'rb') as f:
              data = bytearray(f.read())
          
          nop = struct.pack('<I', 0xD503201F)
          
          # 黑冲冷却相关
          data[0x1df9c:0x1df9c+4] = nop  # SHADOW_DASH_SPEED str
          data[0x1dfa4:0x1dfa4+4] = nop  # SHADOW_DASH_COOLDOWN str
          print("✅ NOP SHADOW_DASH_SPEED + COOLDOWN")
          
          # 搜索 shadowRechargePrefab 相关 STR
          # 偏移 0x398, STR xN 指令
          found = 0
          for addr in range(0, 0x021A8000, 4):
              insn = struct.unpack('<I', data[addr:addr+4])[0]
              if (insn & 0xFFC00000) == 0xF9000000:
                  if ((insn >> 10) & 0xFFF) == 0x398:
                      data[addr:addr+4] = nop
                      found += 1
                      print(f"✅ NOP shadowRechargePrefab @ 0x{addr:08X}")
          
          if found == 0:
              print("⚠️ 未找到 shadowRechargePrefab STR")
          
          with open('UnityFramework', 'wb') as f:
              f.write(data)
          print("✅ 完成")
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: UnityFramework-patched
          path: UnityFramework
