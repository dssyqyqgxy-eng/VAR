name: Convert Resource to TXT

on:
  push:
     

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install UnityPy
        run: pip install UnityPy
        
      - name: Convert all .resource to TXT
        run: |
          python3 << 'EOF'
          import UnityPy
          import os
          import glob
          
          os.makedirs("txt_output", exist_ok=True)
          
          # 找所有 .resource 文件
          for res_file in glob.glob("*.resource"):
              print(f"\n处理: {res_file}")
              env = UnityPy.load(res_file)
              
              output_file = f"txt_output/{res_file}.txt"
              
              with open(output_file, "w", encoding="utf-8") as out:
                  out.write(f"=== {res_file} 提取内容 ===\n\n")
                  
                  for obj in env.objects:
                      try:
                          data = obj.read()
                          out.write(f"\n--- 对象类型: {obj.type.name} | ID: {obj.path_id} ---\n")
                          
                          # 输出所有字段
                          for attr in dir(data):
                              if not attr.startswith('_') and not callable(getattr(data, attr)):
                                  try:
                                      val = getattr(data, attr)
                                      out.write(f"{attr}: {val}\n")
                                  except:
                                      pass
                          out.write("\n")
                      except Exception as e:
                          out.write(f"错误: {e}\n")
              
              print(f"  输出: {output_file}")
          
          print("\n✅ 转换完成")
          EOF
          
      - name: Upload TXT files
        uses: actions/upload-artifact@v4
        with:
          name: resource-txt
          path: txt_output/*.txt
          retention-days: 30
