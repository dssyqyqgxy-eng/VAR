name: 搜索并修改元数据
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索特征值
        run: |
          mkdir -p output
          python3 << 'PYEOF' > output/search_result.txt
          import struct

          def find_all(data, pattern):
              pos = 0
              while True:
                  pos = data.find(pattern, pos)
                  if pos == -1: break
                  yield pos
                  pos += 1

          with open('global-metadata.dat', 'rb') as f:
              data = bytearray(f.read())

          print(f"文件大小: {len(data)} 字节\n")

          print("=== 所有 0.4f 位置 ===")
          for i, pos in enumerate(find_all(data, struct.pack('<f', 0.4))):
              if i >= 15: break
              ctx = data[max(0,pos-8):pos+12]
              print(f"  0x{pos:07X}: {ctx.hex()}")

          print("\n=== 所有 0.5f 位置 ===")
          for i, pos in enumerate(find_all(data, struct.pack('<f', 0.5))):
              if i >= 15: break
              ctx = data[max(0,pos-8):pos+12]
              print(f"  0x{pos:07X}: {ctx.hex()}")
          PYEOF
          cat output/search_result.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: output/
