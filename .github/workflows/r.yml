name: 自动搜索 HealthManager RVA

on:
  push:

  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 深度搜索 HealthManager
        run: |
          {
            echo "=========================================="
            echo "  HealthManager 深度搜索"
            echo "=========================================="
            echo ""
            
            echo "[1] class HealthManager 完整定义"
            grep -A 100 "class HealthManager :" dump.cs | head -120
            echo ""
            
            echo "[2] HealthManager 所有方法 RVA"
            grep -A 100 "class HealthManager :" dump.cs | grep -E "void |bool |int |float |RVA:" | head -50
            echo ""
            
            echo "[3] HealthManager 的 Hit / TakeDamage"
            grep -B 10 "void TakeDamage\|void Hit" dump.cs | grep -E "class HealthManager|RVA:" | head -20
            echo ""
            
            echo "[4] ApplyExtraDamage"
            grep -B 2 "ApplyExtraDamage" dump.cs | grep "RVA:" | head -5
            echo ""
            
            echo "[5] HealthManager.Die"
            grep -B 2 "void Die" dump.cs | grep -E "HealthManager|RVA:" | head -5
            
          } > healthmanager_rva.txt

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: healthmanager-rva
          path: healthmanager_rva.txt
