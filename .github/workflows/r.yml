name: 自动修改元数据
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认偏移 + 修改
        run: |
          python3 << 'PYEOF'
          import struct, os, subprocess

          print("=== 从 dump.cs 确认偏移 ===")
          for keyword in ["attack_cooldown", "SHADOW_DASH_COOLDOWN", "hasShadowDash", "canShadowDash", "public int hp"]:
              result = subprocess.run(["grep", "-n", keyword, "dump.cs"], capture_output=True, text=True)
              if result.stdout:
                  print(f"\n[{keyword}]")
                  print(result.stdout[:200])
              else:
                  print(f"\n[{keyword}] 未找到")

          print("\n=== 开始修改 ===")
          PATCHES = [
              (0x15A3B80, 0.15, 'float'),
              (0x15A3B88, 0.0,  'float'),
              (0x15A3C00, True, 'bool'),
              (0x15A3C01, True, 'bool'),
          ]

          with open('global-metadata.dat', 'rb') as f:
              data = bytearray(f.read())

          for offset, value, vtype in PATCHES:
              if offset >= len(data):
                  print(f"❌ 0x{offset:X} 超出")
                  continue
              old = data[offset:offset+4]
              if vtype == 'float':
                  new = struct.pack('<f', value)
              else:
                  new = struct.pack('<?', bool(value))
              data[offset:offset+len(new)] = new
              print(f"✅ 0x{offset:07X}: {old.hex()} -> {new.hex()}")

          with open('global-metadata.dat', 'wb') as f:
              f.write(data)
          print("✅ 完成")
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: global-metadata-patched
          path: global-metadata.dat
