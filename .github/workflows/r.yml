name: Extract Real Game Values

on:
  push:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install UnityPy
        run: pip install UnityPy
        
      - name: Extract MonoBehaviour fields
        run: |
          python3 << 'EOF'
          import UnityPy
          import json
          import os
          import glob
          
          os.makedirs("output", exist_ok=True)
          
          for res_file in glob.glob("*.resource"):
              print(f"\n=== {res_file} ===")
              env = UnityPy.load(res_file)
              
              for obj in env.objects:
                  if obj.type.name != "MonoBehaviour":
                      continue
                  
                  try:
                      data = obj.read()
                      
                      # 获取类型名称（重要！）
                      script_type = "Unknown"
                      if hasattr(data, 'm_Script') and data.m_Script:
                          if hasattr(data.m_Script, 'm_ClassName'):
                              script_type = data.m_Script.m_ClassName
                      
                      obj_name = getattr(data, 'name', 'Unnamed')
                      
                      print(f"\n--- {script_type} : {obj_name} ---")
                      
                      # 遍历所有字段
                      for key, value in data.script.items():
                          # 跳过内部引用
                          if key in ['m_Script', 'm_GameObject', 'm_Enabled', 'm_Name', 'm_ObjectHideFlags']:
                              continue
                          
                          # 尝试获取实际值
                          try:
                              if hasattr(value, 'value'):
                                  val = value.value
                              else:
                                  val = value
                              
                              # 只显示有意义的数值
                              if val is not None:
                                  print(f"  {key} = {val}")
                          except:
                              pass
                      
                  except Exception as e:
                      print(f"  跳过: {e}")
          
          print("\n✅ 完成")
          EOF
