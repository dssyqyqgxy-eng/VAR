name: 搜索 DoAttack RVA + 完整签名确认
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索
        run: |
          DUMP=$(find . -name "dump.cs" | head -1)
          SCRIPT=$(find . -name "script.json" | head -1)
          
          echo "=== [1] DoAttack RVA ==="
          grep -B 2 -A 5 "DoAttack" "$DUMP" | grep -E "RVA:|void DoAttack" | head -10
          
          echo ""
          echo "=== [2] script.json: DoAttack ==="
          grep -i "DoAttack" "$SCRIPT" | head -5
          
          echo ""
          echo "=== [3] HealthManager.ApplyExtraDamage RVA ==="
          grep -B 2 "HealthManager.*ApplyExtraDamage" "$DUMP" | grep "RVA:" | head -5
          
          echo ""
          echo "=== [4] script.json: HealthManager.ApplyExtraDamage ==="
          grep "HealthManager.*ApplyExtraDamage" "$SCRIPT" | head -3
          
          echo ""
          echo "=== [5] 注入时机: UnityAppController ==="
          grep -i "UnityAppController\|applicationDidBecomeActive\|startUnity\|callbackGfxInited" "$DUMP" | head -10
          
          echo ""
          echo "=== [6] 注入时机: script.json Unity 启动 ==="
          grep -i "startUnity\|callbackGfxInited\|UnityAppController" "$SCRIPT" | head -10

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: final-rva
          path: $(find . -name "*.txt" -o -name "*.md" | head -1)
