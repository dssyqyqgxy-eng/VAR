name: 自动编译并签名 Mod.dylib
on:
  push:

  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 ldid
        run: |
          brew install ldid 2>/dev/null || echo "ldid 已安装或安装失败，尝试继续..."

      - name: 编译 Mod.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null)
          clang -arch arm64 \
            -miphoneos-version-min=12.0 \
            -isysroot "$SDK_PATH" \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -o Mod.dylib \
            Mod.m \
            -Wno-everything

      - name: 签名 Mod.dylib
        run: |
          ldid -S Mod.dylib
          echo "✅ 签名完成"

      - name: 上传 Mod.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Mod.dylib
          path: Mod.dylib
