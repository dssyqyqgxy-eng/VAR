name: 自动编译 Mod.dylib
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译 Mod.dylib
        run: |
          clang -arch arm64 -miphoneos-version-min=12.0 -dynamiclib \
            -framework Foundation -framework UIKit \
            -o Mod.dylib Mod.c -Wno-everything
      - name: 上传 Mod.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Mod.dylib
          path: Mod.dylib
