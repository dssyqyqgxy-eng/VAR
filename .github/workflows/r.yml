name: 搜索所有特征值并修改
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索并修改
        run: |
          python3 << 'PYEOF'
          import struct

          def find_all(data, pattern):
              pos = 0
              while True:
                  pos = data.find(pattern, pos)
                  if pos == -1: break
                  yield pos
                  pos += 1

          with open('global-metadata.dat', 'rb') as f:
              data = bytearray(f.read())

          print(f"文件大小: {len(data)} 字节\n")

          # 列出所有 0.4f
          print("=== 所有 0.4f 位置 ===")
          for i, pos in enumerate(find_all(data, struct.pack('<f', 0.4))):
              if i >= 15: break
              context = data[max(0,pos-8):pos+12]
              print(f"  0x{pos:07X}: {context.hex()}")

          # 列出所有 0.5f
          print("\n=== 所有 0.5f 位置 ===")
          for i, pos in enumerate(find_all(data, struct.pack('<f', 0.5))):
              if i >= 15: break
              context = data[max(0,pos-8):pos+12]
              print(f"  0x{pos:07X}: {context.hex()}")
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: $(find . -name "*.txt" -o -name "*.dat" | head -1)
