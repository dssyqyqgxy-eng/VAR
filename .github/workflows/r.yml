name: 自动修改元数据（解压 script.zip）
on:
  push:
    paths:
      - 'script.zip'
      - 'global-metadata.dat'
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压并查找偏移
        run: |
          unzip -o script.zip
          python3 << 'PYEOF'
          import json, struct, os

          print("=== 从 script.json 查找字段 metadata 偏移 ===")

          targets = {
              "attack_cooldown": None,
              "SHADOW_DASH_COOLDOWN": None,
              "hasShadowDash": None,
              "canShadowDash": None,
              "hp": None,
          }

          with open('script.json', 'r', encoding='utf-8', errors='ignore') as f:
              data = json.load(f)

          # 搜索 ScriptMetadata
          if 'ScriptMetadata' in data:
              for item in data['ScriptMetadata']:
                  name = item.get('Name', '')
                  addr = item.get('Address', 0)
                  for key in targets:
                      if key in name and ' ' not in name.replace(key, '').strip():
                          targets[key] = addr
                          print(f"  ✅ {key}: metadata offset = 0x{addr:X}")

          # 搜索 ScriptString（备选）
          if 'ScriptString' in data:
              for item in data['ScriptString']:
                  val = item.get('Value', '')
                  for key in targets:
                      if val == key:
                          print(f"  📝 字符串 '{key}' @ 0x{item.get('Address', 0):X}")

          # 输出结果
          print("\n=== 找到的偏移 ===")
          found = False
          for key, addr in targets.items():
              if addr:
                  print(f"  {key}: 0x{addr:X}")
                  found = True
          
          if not found:
              print("❌ 未找到字段偏移，列出所有相关 Metadata:")
              if 'ScriptMetadata' in data:
                  for item in data['ScriptMetadata']:
                      name = item.get('Name', '')
                      if any(k in name for k in targets):
                          print(f"  {name} @ 0x{item.get('Address', 0):X}")
          PYEOF

      - name: 修改 metadata
        run: |
          python3 << 'PYEOF'
          import json, struct

          # 先从 script.json 读取偏移
          targets = {}
          with open('script.json', 'r', encoding='utf-8', errors='ignore') as f:
              data = json.load(f)
          if 'ScriptMetadata' in data:
              for item in data['ScriptMetadata']:
                  name = item.get('Name', '')
                  addr = item.get('Address', 0)
                  for key in ["attack_cooldown", "SHADOW_DASH_COOLDOWN", "hasShadowDash", "canShadowDash"]:
                      if key in name and ' ' not in name.replace(key, '').strip():
                          targets[key] = addr

          if not targets:
              print("❌ 无有效偏移，跳过修改")
              exit(0)

          PATCHES = []
          if "attack_cooldown" in targets:
              PATCHES.append((targets["attack_cooldown"], 0.15, 'float'))
          if "SHADOW_DASH_COOLDOWN" in targets:
              PATCHES.append((targets["SHADOW_DASH_COOLDOWN"], 0.0, 'float'))
          if "hasShadowDash" in targets:
              PATCHES.append((targets["hasShadowDash"], True, 'bool'))
          if "canShadowDash" in targets:
              PATCHES.append((targets["canShadowDash"], True, 'bool'))

          with open('global-metadata.dat', 'rb') as f:
              buf = bytearray(f.read())

          print(f"文件大小: {len(buf)} 字节")
          for offset, value, vtype in PATCHES:
              if offset >= len(buf):
                  print(f"❌ 0x{offset:X} 超出")
                  continue
              old = buf[offset:offset+4]
              if vtype == 'float':
                  new = struct.pack('<f', value)
              else:
                  new = struct.pack('<?', bool(value))
              buf[offset:offset+len(new)] = new
              print(f"✅ 0x{offset:07X}: 已修改")

          with open('global-metadata.dat', 'wb') as f:
              f.write(buf)
          print("✅ 完成")
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: global-metadata-patched
          path: global-metadata.dat
