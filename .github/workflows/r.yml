name: 反汇编搜索 SHADOW_DASH_COOLDOWN 初始化
on:
  push:

  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压
        run: unzip -o UnityFramework.zip
      - name: 安装 Capstone
        run: pip install capstone
      - name: 反汇编搜索
        run: |
          python3 << 'PYEOF'
          from capstone import *
          import struct

          with open('UnityFramework', 'rb') as f:
              data = f.read()

          md = Cs(CS_ARCH_ARM64, CS_MODE_ARM)
          text_end = 0x021A8000

          print("=== 搜索 STR 到偏移 0x80 的指令 ===\n")
          count = 0
          for addr in range(0, text_end, 4):
              if addr + 4 > len(data): break
              insn = struct.unpack('<I', data[addr:addr+4])[0]
              
              # STR (immediate) float: 0xBD000000
              # str sX, [xN, #imm]
              if (insn & 0xFFC00000) == 0xBD000000:
                  imm = ((insn >> 10) & 0xFFF) << 2  # 浮点 STR 偏移要 x4
                  if imm == 0x80:
                      count += 1
                      if count <= 30:
                          # 打印前后指令
                          code = data[max(0,addr-64):min(len(data),addr+20)]
                          print(f"--- #{count} @ 0x{addr:08X} ---")
                          for ins in md.disasm(code, max(0,addr-64)):
                              marker = " <--" if ins.address == addr else ""
                              print(f"  0x{ins.address:x}: {ins.mnemonic} {ins.op_str}{marker}")
                          print()

          print(f"共找到 {count} 处")
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: str-0x80
          path: $(find . -name "*.txt" | head -1)
