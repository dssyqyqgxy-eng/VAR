name: objdump 反汇编关键函数
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
      - name: 解压
        run: unzip -o UnityFramework.zip
      - name: 反汇编
        run: |
          echo "=== ShadowDash (0x102D4DC) ==="
          aarch64-linux-gnu-objdump -d --start-address=0x102D4DC --stop-address=0x102D550 UnityFramework 2>/dev/null
          echo ""
          echo "=== TakeDamage (0x102614C) ==="
          aarch64-linux-gnu-objdump -d --start-address=0x102614C --stop-address=0x10261C0 UnityFramework 2>/dev/null
          echo ""
          echo "=== ApplyExtraDamage (0x1022A58) ==="
          aarch64-linux-gnu-objdump -d --start-address=0x1022A58 --stop-address=0x1022AD0 UnityFramework 2>/dev/null
          echo ""
          echo "=== DoAttack (0x102FF1C) ==="
          aarch64-linux-gnu-objdump -d --start-address=0x102FF1C --stop-address=0x102FF80 UnityFramework 2>/dev/null
          echo ""
          echo "=== AnimPlay (0x1314A7C) ==="
          aarch64-linux-gnu-objdump -d --start-address=0x1314A7C --stop-address=0x1314AE0 UnityFramework 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: disasm-output
          path: $(find . -name "*.txt" | head -1)
