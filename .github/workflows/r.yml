name: 提取 HealthManager.ApplyExtraDamage Address
on:
  push:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 提取 Address
        run: |
          SCRIPT=$(find . -name "script.json" | head -1)
          
          python3 << 'PYEOF'
          import json, glob

          script_path = glob.glob("**/script.json", recursive=True)[0]

          with open(script_path, 'r', encoding='utf-8', errors='ignore') as f:
              data = json.load(f)

          targets = [
              "HealthManager$$ApplyExtraDamage",
              "HeroController$$DoAttack",
              "HeroController$$Attack",
              "HeroController$$ShadowDash",
              "HeroController$$TakeDamage",
              "tk2dSpriteAnimator$$Play",
          ]

          print("=== 精确 Address ===")
          if 'ScriptMethod' in data:
              for item in data['ScriptMethod']:
                  name = item.get('Name', '')
                  for target in targets:
                      if name == target:
                          addr = item.get('Address', 0)
                          sig = item.get('Signature', '')
                          print(f"\n{name}")
                          print(f"  Address: 0x{addr:X}")
                          print(f"  Signature: {sig}")
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: final-addresses
          path: $(find . -name "*.txt" -o -name "*.md" | head -1)
