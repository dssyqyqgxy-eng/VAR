name: Deserialize Resource Values

on:
  push:

jobs:
  deserialize:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install UnityPy
        run: pip install UnityPy
        
      - name: Deserialize and print all values
        run: |
          python3 << 'EOF'
          import UnityPy
          import glob
          
          for res_file in glob.glob("*.resource"):
              print(f"\n{'='*50}")
              print(f"文件: {res_file}")
              print('='*50)
              
              env = UnityPy.load(res_file)
              
              for obj in env.objects:
                  if obj.type.name != "MonoBehaviour":
                      continue
                  
                  try:
                      data = obj.read()
                      
                      # 获取类型名
                      type_name = "Unknown"
                      if hasattr(data, 'm_Script') and data.m_Script:
                          type_name = getattr(data.m_Script, 'm_ClassName', 'Unknown')
                      
                      print(f"\n【类型】{type_name}")
                      print(f"【名称】{getattr(data, 'name', '无')}")
                      print(f"【字段】")
                      
                      # 打印所有字段和值
                      for key, val in data.script.items():
                          # 跳过 Unity 内部字段
                          if key in ['m_Script', 'm_GameObject', 'm_Enabled', 'm_Name', 'm_ObjectHideFlags']:
                              continue
                          
                          # 获取实际值
                          actual_val = val.value if hasattr(val, 'value') else val
                          
                          # 只显示数值、布尔、短字符串
                          if isinstance(actual_val, (int, float, bool)):
                              print(f"    {key} = {actual_val}")
                          elif isinstance(actual_val, str) and len(actual_val) < 100:
                              print(f"    {key} = \"{actual_val}\"")
                          
                  except Exception as e:
                      pass
          
          print("\n✅ 完成")
          EOF
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: deserialized-values
          path: ./*.txt 2>/dev/null || echo "done"
          retention-days: 30
