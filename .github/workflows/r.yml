name: 自动编译 Mod.dylib
on:
  push:

  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 查找 iOS SDK 路径
        run: |
          echo "可用的 SDK:"
          xcodebuild -showsdks 2>/dev/null | grep -E "iOS|iphoneos"
          
      - name: 编译 Mod.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "")
          if [ -z "$SDK_PATH" ]; then
            SDK_PATH="/Applications/Xcode_16.4.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS.sdk"
          fi
          echo "使用 SDK: $SDK_PATH"
          
          clang -arch arm64 \
            -miphoneos-version-min=12.0 \
            -isysroot "$SDK_PATH" \
            -dynamiclib \
            -framework Foundation \
            -framework UIKit \
            -o Mod.dylib \
            Mod.m \
            -Wno-everything

      - name: 上传 Mod.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Mod.dylib
          path: Mod.dylib
