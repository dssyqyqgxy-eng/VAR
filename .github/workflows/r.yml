name: 编译 Mod + 精确修改黑冲冷却
on:
  push:

  workflow_dispatch:
jobs:
  build-and-patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # ========== 1. 编译 Mod.dylib ==========
      - name: 编译 Mod.dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -miphoneos-version-min=12.0 -isysroot "$SDK_PATH" \
            -dynamiclib -framework Foundation -framework UIKit \
            -o Mod.dylib Mod.m -Wno-everything
          codesign -f -s - Mod.dylib 2>/dev/null || true
          echo "✅ Mod.dylib 编译完成"

      # ========== 2. 精确修改黑冲冷却 ==========
      - name: 修改元数据
        run: |
          python3 << 'PYEOF'
          import struct

          with open('global-metadata.dat', 'rb') as f:
              data = bytearray(f.read())

          str_pos = data.find(b"SHADOW_DASH_COOLDOWN")
          if str_pos == -1:
              print("❌ 未找到字符串")
              exit(1)

          print(f"字符串 @ 0x{str_pos:07X}")

          pattern = struct.pack('<f', 0.5)
          found = False

          for search_start in [max(0, str_pos - 512), str_pos]:
              search_end = min(len(data), search_start + 1024)
              pos = search_start
              while pos < search_end:
                  pos = data.find(pattern, pos, search_end)
                  if pos == -1: break
                  dist = pos - str_pos
                  ctx = data[max(0,pos-16):min(len(data),pos+16)]
                  print(f"  候选 0x{pos:07X} (距 {dist:+d}): {ctx.hex()}")
                  if abs(dist) < 300 and not found:
                      data[pos:pos+4] = struct.pack('<f', 0.0)
                      print(f"  ✅ 已修改")
                      found = True
                  pos += 1

          if not found:
              print("⚠️ 未找到精确位置，回退全局修改")
              pos = 0
              count = 0
              while True:
                  pos = data.find(pattern, pos)
                  if pos == -1: break
                  data[pos:pos+4] = struct.pack('<f', 0.0)
                  count += 1
                  pos += 4
              print(f"  全局修改 {count} 处")

          with open('global-metadata.dat', 'wb') as f:
              f.write(data)
          print("✅ 元数据修改完成")
          PYEOF

      # ========== 3. 上传 ==========
      - name: 上传 Mod.dylib
        uses: actions/upload-artifact@v4
        with:
          name: Mod.dylib
          path: Mod.dylib

      - name: 上传元数据
        uses: actions/upload-artifact@v4
        with:
          name: global-metadata-patched
          path: global-metadata.dat
