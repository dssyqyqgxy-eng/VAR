name: Extract ALL Resources from .resource files

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  extract-all:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install UnityPy
        run: pip install UnityPy
        
      - name: Extract every resource from all .resource files
        run: |
          python3 << 'EOF'
          import UnityPy
          import json
          import os
          import glob
          from pathlib import Path
          
          os.makedirs("output", exist_ok=True)
          
          # 找到所有 .resource 文件
          resource_files = glob.glob("*.resource")
          
          if not resource_files:
              print("❌ 未找到 .resource 文件")
              exit(1)
          
          print(f"✅ 找到 {len(resource_files)} 个文件: {resource_files}\n")
          
          for res_file in resource_files:
              print(f"📦 处理: {res_file}")
              env = UnityPy.load(res_file)
              
              file_dir = f"output/{res_file.replace('.resource', '')}"
              os.makedirs(file_dir, exist_ok=True)
              
              textures_dir = f"{file_dir}/textures"
              texts_dir = f"{file_dir}/texts"
              monos_dir = f"{file_dir}/monobehaviours"
              raws_dir = f"{file_dir}/raw"
              
              os.makedirs(textures_dir, exist_ok=True)
              os.makedirs(texts_dir, exist_ok=True)
              os.makedirs(monos_dir, exist_ok=True)
              os.makedirs(raws_dir, exist_ok=True)
              
              stats = {"Texture2D": 0, "TextAsset": 0, "MonoBehaviour": 0, "Other": 0}
              
              for obj in env.objects:
                  obj_type = obj.type.name
                  
                  try:
                      data = obj.read()
                      
                      # 1. 导出贴图
                      if obj_type == "Texture2D":
                          img = data.image
                          if img:
                              img.save(f"{textures_dir}/{data.name or obj.path_id}.png")
                              stats["Texture2D"] += 1
                      
                      # 2. 导出文本资源
                      elif obj_type == "TextAsset":
                          txt = data.script
                          if txt:
                              with open(f"{texts_dir}/{data.name or obj.path_id}.txt", "w", encoding="utf-8") as f:
                                  f.write(str(txt))
                              stats["TextAsset"] += 1
                      
                      # 3. 导出 MonoBehaviour（JSON 格式）
                      elif obj_type == "MonoBehaviour":
                          mono_data = {
                              "type": "MonoBehaviour",
                              "name": getattr(data, 'name', 'Unknown'),
                              "path_id": obj.path_id,
                              "fields": {}
                          }
                          
                          # 获取实际类型名
                          if hasattr(data, 'm_Script') and data.m_Script:
                              if hasattr(data.m_Script, 'm_ClassName'):
                                  mono_data["type_name"] = data.m_Script.m_ClassName
                          
                          # 提取所有字段
                          for key, val in data.script.items():
                              try:
                                  if hasattr(val, 'value'):
                                      mono_data["fields"][key] = str(val.value)
                                  elif isinstance(val, (int, float, bool, str)):
                                      mono_data["fields"][key] = str(val)
                                  else:
                                      mono_data["fields"][key] = f"<{type(val).__name__}>"
                              except:
                                  mono_data["fields"][key] = "<error>"
                          
                          if mono_data["fields"]:
                              safe_name = f"{mono_data.get('type_name', 'Unknown')}_{mono_data['name']}_{obj.path_id}"
                              safe_name = "".join(c for c in safe_name if c.isalnum() or c in '._-')[:80]
                              with open(f"{monos_dir}/{safe_name}.json", "w", encoding="utf-8") as f:
                                  json.dump(mono_data, f, indent=2, ensure_ascii=False)
                              stats["MonoBehaviour"] += 1
                      
                      # 4. 导出其他类型为原始数据
                      else:
                          raw_data = {
                              "type": obj_type,
                              "path_id": obj.path_id,
                              "data": str(data) if data else "null"
                          }
                          with open(f"{raws_dir}/{obj_type}_{obj.path_id}.json", "w", encoding="utf-8") as f:
                              json.dump(raw_data, f, indent=2)
                          stats["Other"] += 1
                          
                  except Exception as e:
                      print(f"  ⚠️ 跳过 {obj_type} {obj.path_id}: {e}")
              
              print(f"  ✅ 贴图: {stats['Texture2D']} | 文本: {stats['TextAsset']} | MonoBehaviour: {stats['MonoBehaviour']} | 其他: {stats['Other']}")
              
              # 保存统计
              with open(f"{file_dir}/_stats.json", "w") as f:
                  json.dump(stats, f, indent=2)
              
              print(f"  📁 输出: {file_dir}\n")
          
          # 生成总报告
          total = {"files": resource_files}
          with open("output/_complete_report.json", "w") as f:
              json.dump(total, f, indent=2)
          
          print("✅ 全部提取完成！")
          EOF
          
      - name: 打包并上传
        uses: actions/upload-artifact@v4
        with:
          name: all-resources-extracted
          path: output/
          compression-level: 9
          retention-days: 7
          
      - name: 显示提取统计
        run: |
          echo "=== 提取统计 ==="
          find output -name "_stats.json" -exec cat {} \;
          echo ""
          echo "=== 文件树 ==="
          tree output/ -L 2 2>/dev/null || find output -type f | head -50
