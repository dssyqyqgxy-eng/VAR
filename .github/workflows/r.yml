name: 编译 Mod.dylib
on:
  push:
    
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -miphoneos-version-min=12.0 -isysroot "$SDK_PATH" \
            -dynamiclib -framework Foundation -framework UIKit \
            -o Mod.dylib Mod.m -Wno-everything
          codesign -f -s - Mod.dylib 2>/dev/null || true
          echo "✅ 编译完成"
          ls -la Mod.dylib

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: Mod.dylib
          path: Mod.dylib
