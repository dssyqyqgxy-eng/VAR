name: 确认函数签名 + 注入时机
on:
  push:
    paths:
      - 'script.zip'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索函数签名
        run: |
          DUMP=$(find . -name "dump.cs" | head -1)
          SCRIPT=$(find . -name "script.json" | head -1)
          
          echo "=========================================="
          echo "  函数签名 & 注入时机分析"
          echo "=========================================="
          
          echo ""
          echo "========== [1] HeroController.TakeDamage 签名 =========="
          grep -B 2 -A 8 "void TakeDamage" "$DUMP" | head -40
          
          echo ""
          echo "========== [2] HealthManager.ApplyExtraDamage 签名 =========="
          grep -B 2 -A 8 "ApplyExtraDamage" "$DUMP" | head -30
          
          echo ""
          echo "========== [3] tk2dSpriteAnimator.Play 签名 =========="
          grep -A 200 "class tk2dSpriteAnimator" "$DUMP" | grep -B 2 -A 2 "void Play" | head -30
          
          echo ""
          echo "========== [4] HeroController.ShadowDash 签名 =========="
          grep -B 2 -A 5 "void ShadowDash" "$DUMP" | head -20
          
          echo ""
          echo "========== [5] 注入时机: HeroController 生命周期 =========="
          grep -E "class HeroController|void Awake|void Start|void Update|void OnEnable" "$DUMP" | head -20
          
          echo ""
          echo "========== [6] 注入时机: UnityAppController =========="
          grep -B 2 -A 3 "applicationDidBecomeActive\|startUnity\|callbackGfxInited\|runEmbedded" "$DUMP" | head -20
          
          echo ""
          echo "========== [7] script.json: ShadowDash =========="
          grep -i "ShadowDash\|Shadow_Dash" "$SCRIPT" | head -10
          
          echo ""
          echo "========== [8] script.json: TakeDamage =========="
          grep -i "HeroController.*TakeDamage\|TakeDamage.*HeroController" "$SCRIPT" | head -10
          
          echo ""
          echo "========== [9] script.json: ApplyExtraDamage =========="
          grep -i "ApplyExtraDamage" "$SCRIPT" | head -10
          
          echo ""
          echo "========== [10] script.json: Animator.Play =========="
          grep -i "tk2dSpriteAnimator.*Play" "$SCRIPT" | head -10
          
          echo ""
          echo "=========================================="
          echo "  分析完成"
          echo "=========================================="

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: signature-analysis
          path: $(find . -name "*.txt" -o -name "*.md" | head -1)
