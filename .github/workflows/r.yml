name: 搜索攻击动画判断 + Boss血量 RVA
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索
        run: |
          DUMP=$(find . -name "dump.cs" | head -1)
          SCRIPT=$(find . -name "script.json" | head -1)
          
          echo "=== [1] tk2dSpriteAnimationClip.name 字段 ==="
          grep -A 30 "class tk2dSpriteAnimationClip" "$DUMP" | grep -E "name|Name|string" | head -10
          
          echo ""
          echo "=== [2] HealthManager.ApplyExtraDamage RVA ==="
          grep -B 2 "HealthManager.*ApplyExtraDamage\|ApplyExtraDamage.*HealthManager" "$DUMP" | grep "RVA:" | head -5
          
          echo ""
          echo "=== [3] script.json: HealthManager.ApplyExtraDamage ==="
          grep -i "HealthManager.*ApplyExtraDamage" "$SCRIPT" | head -5
          
          echo ""
          echo "=== [4] script.json: tk2dSpriteAnimationClip.name ==="
          grep -i "tk2dSpriteAnimationClip.*name\|tk2dSpriteAnimationClip.*Name" "$SCRIPT" | head -5
          
          echo ""
          echo "=== [5] HeroController.Attack 方法 ==="
          grep -B 2 "void Attack\|private void Attack\|public void Attack" "$DUMP" | grep "RVA:" | head -10
          
          echo ""
          echo "=== [6] script.json: HeroController.Attack ==="
          grep -i "HeroController.*Attack" "$SCRIPT" | grep -v "AttackCooldown\|AttackSpeed\|AttackPower" | head -10

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: boss-and-attack-rva
          path: $(find . -name "*.txt" -o -name "*.md" | head -1)
