name: 精确定位 metadata 字段偏移
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 精确定位字段默认值
        run: |
          python3 << 'PYEOF'
          import struct

          with open('global-metadata.dat', 'rb') as f:
              data = f.read()

          print(f"文件大小: {len(data)} 字节")
          print(f"Magic: {data[:4].hex()}")

          # ==========================================
          # 1. 搜索字段名字符串
          # ==========================================
          fields = [
              b"attack_cooldown",
              b"SHADOW_DASH_COOLDOWN",
              b"hasShadowDash",
              b"canShadowDash",
              b"SHADOW_DASH_SPEED",
              b"SHADOW_DASH_TIME",
          ]

          print("\n=== 字段名在 metadata 中的位置 ===")
          field_positions = {}
          for field in fields:
              pos = data.find(field)
              if pos != -1:
                  field_positions[field.decode()] = pos
                  # 字段名后通常紧跟类型信息和默认值
                  after = data[pos+len(field):pos+len(field)+32]
                  print(f"  {field.decode()} @ 0x{pos:07X}")
                  print(f"    后续字节: {after[:16].hex()}")
              else:
                  print(f"  ❌ {field.decode()} 未找到")

          # ==========================================
          # 2. 搜索 float 默认值附近的结构
          # ==========================================
          print("\n=== 分析 0.5f 位置的上下文 ===")
          pattern = struct.pack('<f', 0.5)
          for i, pos in enumerate(find_all(data, pattern)):
              if i >= 15: break
              before = data[max(0,pos-16):pos]
              after = data[pos+4:pos+20]
              
              # 检查前面是否有字段名字符串引用
              print(f"\n  位置 0x{pos:07X}:")
              print(f"    前16字节: {before.hex()}")
              print(f"    后16字节: {after.hex()}")

          # ==========================================
          # 3. 搜索 0.4f 位置
          # ==========================================
          print("\n=== 搜索 0.4f ===")
          pattern = struct.pack('<f', 0.4)
          found_04 = list(find_all(data, pattern))
          if found_04:
              for pos in found_04[:5]:
                  print(f"  0x{pos:07X}")
          else:
              print("  ❌ 未找到 0.4f")

          # ==========================================
          # 4. 搜索可能的攻击冷却值 (0.41, 0.45, 0.35等)
          # ==========================================
          print("\n=== 搜索接近 0.4 的值 ===")
          for val in [0.35, 0.41, 0.45, 0.3, 0.25]:
              pattern = struct.pack('<f', val)
              count = len(list(find_all(data, pattern)))
              if count > 0:
                  print(f"  {val}f: {count} 处")
          PYEOF

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: metadata-analysis
          path: /home/runner/work/**/*.txt
