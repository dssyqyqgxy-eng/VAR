name: 自动修改 UnityFramework
on:
  push:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压并修改
        run: |
          echo "=== 所有 zip ==="
          find . -name "*.zip" -ls
          
          # 只解压 UnityFramework.zip
          unzip -o UnityFramework.zip
          
          # 找 UnityFramework 文件
          UF=$(find . -name "UnityFramework" -type f | head -1)
          echo "文件: $UF ($(wc -c < "$UF") 字节)"
          
          # 修改
          python3 << 'PYEOF'
          import struct, subprocess, glob
          
          # 找文件
          candidates = glob.glob("**/UnityFramework", recursive=True)
          uf = candidates[0]
          print(f"修改: {uf}")
          
          with open(uf, 'rb') as f:
              data = bytearray(f.read())
          
          for old_v, new_v, name in [(0.4, 0.15, "攻击冷却"), (0.5, 0.0, "黑冲冷却")]:
              old = struct.pack('<f', old_v)
              new = struct.pack('<f', new_v)
              c, pos = 0, 0
              while True:
                  pos = data.find(old, pos)
                  if pos == -1: break
                  data[pos:pos+4] = new
                  c += 1; pos += 4
              print(f"{name}: {old_v}f -> {new_v}f ({c}处)")
          
          with open(uf, 'wb') as f:
              f.write(data)
          print("✅ 完成")
          PYEOF
          
          cp "$UF" UnityFramework-patched

      - uses: actions/upload-artifact@v4
        with:
          name: UnityFramework-patched
          path: UnityFramework-patched
