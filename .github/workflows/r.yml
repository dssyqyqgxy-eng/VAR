name: 自动提取关键 RVA

on:
  push:

  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 自动提取所有关键 RVA
        run: |
          {
            echo "=========================================="
            echo "  空洞骑士 Mod 关键 RVA 提取"
            echo "  时间: $(date)"
            echo "=========================================="
            echo ""
            
            echo "[1] HeroController.TakeDamage RVA"
            grep -A 3 "HeroController.*TakeDamage" dump.cs | grep "RVA:" | head -5
            echo ""
            
            echo "[2] HealthManager.TakeDamage RVA"
            grep -A 3 "HealthManager.*TakeDamage" dump.cs | grep "RVA:" | head -5
            echo ""
            
            echo "[3] HealthManager.Hit RVA"
            grep -A 3 "HealthManager.*Hit" dump.cs | grep "RVA:" | head -5
            echo ""
            
            echo "[4] ShadowDash RVA"
            grep -A 1 "ShadowDash" dump.cs | grep "RVA:" | head -5
            echo ""
            
            echo "[5] 攻击冷却 / 黑冲 字段偏移"
            grep -E "attack_cooldown|hasShadowDash|canShadowDash|SHADOW_DASH" dump.cs | head -10
            echo ""
            
            echo "[6] HealthManager.hp 偏移"
            grep -E "public int hp" dump.cs | head -10
            echo ""
            
            echo "[7] tk2dSpriteAnimator.Play RVA"
            grep -A 1 "public void Play" dump.cs | grep "RVA:" | head -5
            echo ""
            
            echo "[8] BossSceneController 相关"
            grep -A 3 "BossSceneController" dump.cs | grep "RVA:" | head -10
            echo ""
            
            echo "=========================================="
            echo "  提取完成"
            echo "=========================================="
          } > extracted_rva.txt

      - name: 上传提取结果
        uses: actions/upload-artifact@v4
        with:
          name: extracted-rva
          path: extracted_rva.txt
