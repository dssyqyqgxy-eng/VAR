# .github/workflows/build_insert_dylib_ios.yml
name: Build insert_dylib for iOS

on:
  push:
    branches: [ main, master ]

env:
  REPO: tyilo/insert_dylib
  STATIC_LIB_NAME: libinsert_dylib.a

jobs:
  build:
    name: Build for iOS (${{ matrix.config.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: ios_device_arm64
            arch: arm64
            sdk: iphoneos
            deployment_target: 11.0
          - name: ios_simulator_arm64
            arch: arm64
            sdk: iphonesimulator
            deployment_target: 11.0
          - name: ios_simulator_x86_64
            arch: x86_64
            sdk: iphonesimulator
            deployment_target: 11.0

    steps:
      - name: Checkout insert_dylib source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO }}
          path: insert_dylib_src
          ref: master

      - name: Build static library for ${{ matrix.config.sdk }}
        working-directory: insert_dylib_src
        run: |
          # 编译 main.c
          xcrun -sdk ${{ matrix.config.sdk }} clang \
            -arch ${{ matrix.config.arch }} \
            -c main.c \
            -o insert_dylib.o \
            -Os \
            -mios-version-min=${{ matrix.config.deployment_target }}
          
          # 创建静态库
          ar rcs ${{ env.STATIC_LIB_NAME }} insert_dylib.o
          
          # 生成头文件（根据 main.c 中的函数声明）
          cat > insert_dylib.h << 'EOF'
          #ifndef INSERT_DYLIB_H
          #define INSERT_DYLIB_H
          
          #include <stdio.h>
          #include <stdbool.h>
          
          #ifdef __cplusplus
          extern "C" {
          #endif
          
          // 命令行入口函数
          int insert_dylib_main(int argc, const char* argv[]);
          
          #ifdef __cplusplus
          }
          #endif
          
          #endif
          EOF

      - name: Upload static library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}
          path: |
            insert_dylib_src/${{ env.STATIC_LIB_NAME }}
            insert_dylib_src/insert_dylib.h
          retention-days: 30

  create_xcframework:
    name: Create XCFramework
    runs-on: macos-latest
    needs: build
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create XCFramework
        run: |
          mkdir -p xcframework_output
          
          cp artifacts/ios_device_arm64/insert_dylib.h xcframework_output/
          
          xcodebuild -create-xcframework \
            -library artifacts/ios_device_arm64/libinsert_dylib.a \
            -library artifacts/ios_simulator_arm64/libinsert_dylib.a \
            -library artifacts/ios_simulator_x86_64/libinsert_dylib.a \
            -output xcframework_output/InsertDylib.xcframework

      - name: Upload XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: InsertDylib.xcframework
          path: xcframework_output/
          retention-days: 30
