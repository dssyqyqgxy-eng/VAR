name: 自动搜索 DATA 段可修改值
on:
  push:

  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 搜索 DATA 段
        run: |
          unzip -o UnityFramework.zip
          python3 << 'PYEOF'
          import struct
          with open('UnityFramework', 'rb') as f:
              data = f.read()
          ds, de = 0x021A8000, 0x023E4000
          seg = data[ds:de]
          print(f"__DATA: {len(seg)} 字节\n")
          for val, name in [(0.4, "攻击冷却"), (0.5, "黑冲冷却"), (0.3, "黑冲时间"), (15.0, "黑冲速度")]:
              p = struct.pack('<f', val)
              c, pos = 0, 0
              while True:
                  pos = seg.find(p, pos)
                  if pos == -1: break
                  a = ds + pos
                  ctx = data[max(0,a-8):min(len(data),a+12)]
                  print(f"{name} ({val}f) @ 0x{a:08X}: {ctx.hex()}")
                  c += 1; pos += 4
              print(f"共 {c} 处\n")
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: data-analysis
          path: $(find . -name "*.txt" | head -1)
