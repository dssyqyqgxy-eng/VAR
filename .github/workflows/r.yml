name: 编译优化器
on:
  push:

  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -miphoneos-version-min=12.0 -isysroot "$SDK_PATH" \
            -dynamiclib -framework Foundation -framework UIKit -framework QuartzCore \
            -o HKSmartOptimizer.dylib HKSmartOptimizer.m -Wno-everything
      - name: 签名
        run: |
          curl -L -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5procursus7/ldid_macosx_x86_64
          chmod +x ldid && ./ldid -S HKSmartOptimizer.dylib
      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: HKSmartOptimizer.dylib
          path: HKSmartOptimizer.dylib
