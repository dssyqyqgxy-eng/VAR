name: 搜索并修改元数据
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压
        run: unzip -o script.zip

      - name: 搜索特征值并修改
        run: |
          python3 << 'PYEOF'
          import struct, glob, json

          # 1. 从 dump.cs 确认字段的类内偏移
          dump_path = glob.glob("**/dump.cs", recursive=True)[0]
          
          field_offsets = {}
          with open(dump_path, 'r', encoding='utf-8', errors='ignore') as f:
              for line in f:
                  for key in ["attack_cooldown", "SHADOW_DASH_COOLDOWN", "hasShadowDash", "canShadowDash", "public int hp"]:
                      if key in line and "// 0x" in line:
                          offset = line.split("// 0x")[-1].strip().split()[0]
                          field_offsets[key] = int(offset, 16)
                          print(f"  {key}: 类内偏移 0x{offset}")
          
          # 2. 在 metadata 文件中搜索这些默认值
          # 攻击冷却默认值 0.4f, 黑冲冷却 0.5f
          print("\n=== 在 metadata 中搜索默认值 ===")
          
          with open('global-metadata.dat', 'rb') as f:
              data = f.read()
          
          # 搜索 float 值 0.4 (攻击冷却默认)
          pattern = struct.pack('<f', 0.4)
          pos = 0
          while True:
              pos = data.find(pattern, pos)
              if pos == -1: break
              print(f"  0.4f @ 0x{pos:07X}")
              pos += 1
          
          # 搜索 float 值 0.5 (黑冲冷却默认)
          pattern = struct.pack('<f', 0.5)
          pos = 0
          while True:
              pos = data.find(pattern, pos)
              if pos == -1: break
              print(f"  0.5f @ 0x{pos:07X}")
              pos += 1
          
          PYEOF

      - name: 上传搜索结果
        uses: actions/upload-artifact@v4
        with:
          name: search-results
          path: |
            $(find . -name "dump.cs" | head -1)
