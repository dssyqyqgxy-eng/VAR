name: 自动解压修改 UnityFramework
on:
  push:

  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解压 → 修改 → 输出
        run: |
          ARCHIVE=$(find . -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar" | head -1)
          echo "📦 $ARCHIVE"
          
          if [[ "$ARCHIVE" == *.zip ]]; then unzip -o "$ARCHIVE"
          elif [[ "$ARCHIVE" == *.tar.gz ]]; then tar -xzf "$ARCHIVE"
          elif [[ "$ARCHIVE" == *.tar ]]; then tar -xf "$ARCHIVE"
          fi
          
          UF=$(find . -name "UnityFramework" -type f | head -1)
          echo "🔧 $UF ($(wc -c < "$UF") 字节)"
          
          python3 << PYEOF
          import struct
          with open("$UF", 'rb') as f:
              data = bytearray(f.read())
          for old_v, new_v, name in [(0.4, 0.15, "攻击冷却"), (0.5, 0.0, "黑冲冷却")]:
              old = struct.pack('<f', old_v)
              new = struct.pack('<f', new_v)
              c, pos = 0, 0
              while True:
                  pos = data.find(old, pos)
                  if pos == -1: break
                  data[pos:pos+4] = new
                  c += 1; pos += 4
              print(f"{name}: {old_v}f→{new_v}f ({c}处)")
          with open("$UF", 'wb') as f:
              f.write(data)
          print("✅ 完成")
          PYEOF
          
          cp "$UF" UnityFramework-patched

      - uses: actions/upload-artifact@v4
        with:
          name: UnityFramework-patched
          path: UnityFramework-patched
