name: 搜索 SHADOW_DASH_COOLDOWN 初始化
on:
  push:
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 解压
        run: unzip -o UnityFramework.zip
      - name: 搜索 STR 0x80
        run: |
          python3 << 'PYEOF'
          import struct

          with open('UnityFramework', 'rb') as f:
              data = f.read()

          text_end = 0x021A8000
          found = []

          for addr in range(0, text_end, 4):
              insn = struct.unpack('<I', data[addr:addr+4])[0]
              # STR (immediate) 编码: 11 1110 0100 xxxx xxxx xxxx xxxx xxxx
              if (insn & 0xFFC00000) == 0x3D000000:
                  imm = (insn >> 10) & 0xFFF
                  if imm == 0x80:
                      found.append((addr, insn))

          print(f"找到 {len(found)} 处 STR 到偏移 0x80\n")
          for addr, insn in found[:30]:
              ctx_before = data[max(0,addr-16):addr]
              ctx_after  = data[addr+4:min(len(data),addr+20)]
              rt = insn & 0x1F
              rn = (insn >> 5) & 0x1F
              print(f"0x{addr:08X}: STR s{rt}, [x{rn}, #0x80]")
              print(f"  前: {ctx_before.hex()}")
              print(f"  后: {ctx_after.hex()}")

              # 检查前面是否加载了 0.5f
              for back in range(addr-4, max(0,addr-64), -4):
                  prev = struct.unpack('<I', data[back:back+4])[0]
                  # FMOV sX, #0.5 = 0x1E20100X
                  if (prev & 0xFFFF0000) == 0x1E200000:
                      sreg = prev & 0x1F
                      # 检查后面是否有 FMOV sX, #0.5 对应的 LDR
                      # 0.5 = 0x3F000000 (float)
              print()
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: str-0x80-search
          path: $(find . -name "*.txt" | head -1)
